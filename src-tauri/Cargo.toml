[package]
name = "airvault"
version = "0.1.0"
edition = "2021"
build = "build.rs"
[features]
default = ["network", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
network = ["airvault-core/network"]
[build-dependencies]
sha2 = "0.10"
serde_json = "1"
tauri-build = { version = "2", features = [] }
[dependencies]
airvault-core = { path = "../crates/airvault-core", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
uuid.workspace = true
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
