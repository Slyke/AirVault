[workspace]
members = ["crates/airvault-core", "src-tauri"]
default-members = ["crates/airvault-core"]
resolver = "2"
[profile.release]
lto = "thin"
strip = true
codegen-units = 8
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["derive", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
